[workspace]

[package]
name = "dekopon-gh-provider"
version = "0.7.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "GitHub repository, pull-request, and issue capabilities for Dekopon, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-provider-gh"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
dekopon-provider-sdk = "=0.38.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.38.0"

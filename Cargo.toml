[workspace]

[package]
name = "dekopon-gh-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "GitHub repository, pull-request, and issue capabilities for Dekopon, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-provider-gh"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
# Plain crates.io versions, pinned exactly and together so the two cannot skew. Both carry
# `dekopon:provider@0.2.0` and the command-word surface (`command_words`, `resolve_command`,
# `CommandInvocation`, `export_provider_with_commands!`) as of 0.9.0. This deliberately does not
# use a git dependency: the earlier branch pin rotted the moment that branch was deleted upstream,
# and a `branch =` dependency resolves by fetching the ref, so a cold cache could not build at all.
dekopon-provider-http = "=0.9.0"
dekopon-provider-sdk = "=0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = { version = "0.44.0", default-features = false, features = ["macros", "realloc"] }

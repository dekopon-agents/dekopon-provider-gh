[workspace]

[package]
name = "gh-foundation-fixture"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
dekopon-gh-provider = { path = "../.." }
dekopon-provider-sdk = "=0.64.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace]

[package]
name = "gh-foundation-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
dekopon-gh-provider = { path = "../..", features = ["foundation-fixture"] }
dekopon-provider-sdk = "=0.45.0"
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

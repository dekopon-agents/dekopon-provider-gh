name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `--component clippy rustfmt` reads the second name as a toolchain, not a component, so
      # both names need their own flag. `rustup override set` is what makes the pin real: without
      # it the toolchain is installed and then every cargo step below runs on the runner default.
      - run: |
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          rustup override set "$PROVIDER_RUST_TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The component is what ships; a crate that only compiles natively is not evidence.
      - run: cargo check --locked --target wasm32-unknown-unknown

  component:
    name: Reproducible component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked

      # The WIT in this repository is a mirror of dekopon's. Out of tree there is no shared file to
      # keep them honest, so fetch the originals at the released version Cargo.lock resolved and
      # compare. An interface change upstream fails here loudly, rather than producing a component
      # that mismatches the host it will be loaded into.
      - name: Check the WIT mirrors against the pinned dekopon release
        run: |
          set -euo pipefail
          # Read the version from Cargo.lock rather than Cargo.toml: it is what cargo actually
          # built against, and the release tag is derived from it so the two cannot skew.
          version=$(sed -n '/^name = "dekopon-provider-sdk"$/,/^$/s/^version = "\(.*\)"$/\1/p' Cargo.lock | head -1)
          http_version=$(sed -n '/^name = "dekopon-provider-http"$/,/^$/s/^version = "\(.*\)"$/\1/p' Cargo.lock | head -1)
          test -n "$version"
          # The two are published from one workspace at one version. If they ever skew, the WIT
          # fetched below matches only one of them and the mirror check proves nothing.
          if [ "$version" != "$http_version" ]; then
            echo "dekopon-provider-sdk $version and dekopon-provider-http $http_version disagree" >&2
            exit 1
          fi
          echo "pinned dekopon release: v$version"
          base="https://raw.githubusercontent.com/dekopon-agents/dekopon/v$version"
          curl -fsSL "$base/crates/dekopon-provider-sdk/wit/provider.wit" -o "$RUNNER_TEMP/provider.wit"
          curl -fsSL "$base/wit/http/http.wit" -o "$RUNNER_TEMP/http.wit"
          cmp "$RUNNER_TEMP/provider.wit" wit/deps/provider.wit
          cmp "$RUNNER_TEMP/http.wit" wit/deps/http.wit

      - name: Build the component, then rebuild it and compare
        run: |
          set -euo pipefail
          ./build.sh
          # Determinism is the property the harness exists for, so assert it rather than trust it.
          # A second build from a clean target directory must land on the same bytes.
          CARGO_TARGET_DIR="$RUNNER_TEMP/rebuild" ./build.sh "$RUNNER_TEMP/rebuild.wasm"
          cmp gh-provider.wasm "$RUNNER_TEMP/rebuild.wasm"

      # A provider that reaches the outside world through anything but its declared imports is not
      # sandboxed by the broker. These three are the ambient escape hatches wasm32 makes available.
      - name: Reject ambient dependencies
        run: |
          set -euo pipefail
          cargo tree --locked --target wasm32-unknown-unknown --edges normal,build > deps.tree
          if grep -Eqi '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' deps.tree; then
            echo "forbidden ambient dependency" >&2
            grep -Ein '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' deps.tree >&2
            exit 1
          fi

      - name: Inspect the component
        run: |
          set -euo pipefail
          core=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -type f -name '*.wasm' -print -quit)
          test -n "$core"
          wasm-tools metadata show "$core" | grep -q 'Rust'
          wasm-tools metadata show gh-provider.wasm | grep -q 'wit-bindgen-rust'
          # This provider reaches GitHub through the broker's HTTP client and nothing else. Any
          # other core import is a new authority nobody reviewed.
          wasm-tools print "$core" | grep '(import ' > core-imports.txt || true
          test -s core-imports.txt
          if grep -Fv 'dekopon:http/client@1.0.0' core-imports.txt; then
            echo "unexpected core import" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gh-provider.wasm
          path: |
            gh-provider.wasm
            gh-provider.wasm.sha256

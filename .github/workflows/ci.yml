name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.89.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      # The component is what ships; a crate that only compiles natively is not evidence.
      - run: cargo check --locked --target wasm32-unknown-unknown
